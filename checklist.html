<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Site Test Checklist</title>
<style>
:root {
  --bg: #f3f5f8;
  --card: #ffffff;
  --border: #e2e8f0;
  --text: #1e293b;
  --muted: #64748b;
  --primary: #024372;
  --primary-hover: #03365c;
  --accent: #ef950e;
  --pass: #16a34a;
  --fail: #dc2626;
  --pending: #d97706;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
.topbar { position: sticky; top: 0; z-index: 10; background: var(--primary); color: #fff; padding: 14px 20px; box-shadow: 0 2px 10px rgba(0,0,0,.15); }
.topbar .row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; max-width: 1100px; margin: 0 auto; }
.topbar h1 { font-size: 18px; font-weight: 700; letter-spacing: -.02em; }
.topbar .sub { font-size: 12px; opacity: .75; }
.progress-wrap { flex: 1; min-width: 200px; }
.progress-bar { height: 8px; background: rgba(255,255,255,.25); border-radius: 99px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--accent); width: 0; transition: width .3s; }
.progress-label { font-size: 12px; opacity: .9; margin-top: 4px; }
.btn { border: none; cursor: pointer; font: inherit; font-weight: 600; border-radius: 8px; padding: 8px 14px; transition: opacity .15s; }
.btn:hover { opacity: .85; }
.btn-light { background: rgba(255,255,255,.15); color: #fff; }
.btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
.btn-primary { background: var(--primary); color: #fff; }
.btn-danger { background: #fef2f2; color: var(--fail); border: 1px solid #fecaca; }
.container { max-width: 1100px; margin: 20px auto; padding: 0 16px; display: flex; flex-direction: column; gap: 14px; }
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.toolbar input[type=search] { flex: 1; min-width: 200px; padding: 9px 14px; border: 1px solid var(--border); border-radius: 8px; font: inherit; background: var(--card); }
.toolbar .spacer { flex: 1; }
.cat { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.cat-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; cursor: pointer; user-select: none; }
.cat-head:hover { background: #f8fafc; }
.cat-head .caret { transition: transform .2s; color: var(--muted); font-size: 12px; }
.cat-head.collapsed .caret { transform: rotate(-90deg); }
.cat-name { font-weight: 700; font-size: 15px; flex: 1; border: none; background: transparent; font: inherit; padding: 4px; border-radius: 6px; }
.cat-name:focus { outline: 2px solid var(--accent); background: #fffdf6; }
.cat-count { font-size: 12px; color: var(--muted); background: var(--bg); border-radius: 99px; padding: 3px 10px; }
.cat-body { border-top: 1px solid var(--border); padding: 8px; }
.cat-body.hidden { display: none; }
.item { display: flex; gap: 10px; padding: 10px; border-radius: 10px; border: 1px solid transparent; }
.item:hover { background: #f8fafc; border-color: var(--border); }
.item .main { flex: 1; min-width: 0; }
.item .text-row { display: flex; align-items: flex-start; gap: 8px; }
.item .chk { margin-top: 3px; width: 18px; height: 18px; cursor: pointer; accent-color: var(--pass); flex-shrink: 0; }
.item .label { font-size: 14px; line-height: 1.45; word-break: break-word; }
.item .label.s-fail { text-decoration: line-through; opacity: .75; }
.item .label.editing { width: 100%; border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; font: inherit; }
.item .meta { display: flex; gap: 8px; align-items: center; margin-top: 6px; flex-wrap: wrap; }
.item .url { font-size: 12px; color: var(--muted); text-decoration: none; }
.item .url:hover { color: var(--primary); text-decoration: underline; }
.item .url-input { flex: 1; min-width: 120px; font-size: 12px; font-family: ui-monospace, monospace; padding: 4px 8px; border: 1px solid var(--border); border-radius: 6px; }
.item .url-input:focus { outline: 2px solid var(--accent); }
.item .note { width: 100%; margin-top: 6px; padding: 6px 10px; border: 1px solid var(--border); border-radius: 8px; font: inherit; font-size: 13px; resize: vertical; min-height: 34px; }
.item .note:focus { outline: 2px solid var(--accent); }
select.status { font: inherit; font-size: 13px; font-weight: 600; border-radius: 8px; border: 1px solid var(--border); padding: 5px 8px; cursor: pointer; background: var(--card); }
select.status.s-pass { background: #f0fdf4; color: var(--pass); border-color: #bbf7d0; }
select.status.s-fail { background: #fef2f2; color: var(--fail); border-color: #fecaca; }
select.status.s-pending { background: #fffbeb; color: var(--pending); border-color: #fde68a; }
.icon-btn { background: none; border: none; cursor: pointer; color: var(--muted); font-size: 15px; padding: 4px 6px; border-radius: 6px; line-height: 1; }
.icon-btn:hover { background: #eef2f7; color: var(--text); }
.icon-btn.danger:hover { background: #fef2f2; color: var(--fail); }
.add-item { margin: 8px 6px; width: calc(100% - 12px); padding: 10px; border: 2px dashed var(--border); border-radius: 10px; background: transparent; color: var(--muted); font: inherit; cursor: pointer; }
.add-item:hover { border-color: var(--accent); color: var(--primary); }
.add-cat { padding: 14px; border: 2px dashed var(--border); border-radius: 12px; background: transparent; color: var(--muted); font: inherit; font-weight: 600; cursor: pointer; }
.add-cat:hover { border-color: var(--accent); color: var(--primary); }
.empty { text-align: center; color: var(--muted); padding: 30px 10px; font-size: 14px; }
footer { text-align: center; color: var(--muted); font-size: 12px; padding: 20px; }
footer .hint { background: #fffbeb; border: 1px solid #fde68a; color: #92400e; border-radius: 8px; padding: 8px 12px; display: inline-block; }
.hidden { display: none !important; }
@media (max-width: 640px) {
  .topbar .row { flex-direction: column; align-items: flex-start; }
  .progress-wrap { width: 100%; }
}
</style>
</head>

    const raw = localStorage.getItem(LS_KEY);
    if (raw) {
      const d = JSON.parse(raw);
      if (d && Array.isArray(d.categories)) return d;
    }
  } catch(e) { console.warn('localStorage okunamadı', e); }
  return structuredClone(DEFAULT_DATA);
}

function save() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(data)); }
  catch(e) { console.warn('kaydedilemedi', e); }
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

const state = { collapsed: {}, search: '', editingId: null };

/* ======= Render ======= */
const catsEl = document.getElementById('cats');
const progFill = document.getElementById('progFill');
const progLabel = document.getElementById('progLabel');

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function statusLabel(s) {
  return { pass:'Geçti', fail:'Kaldı', pending:'Bekliyor' }[s] || 'Bekliyor';
}

function statusClass(s) {
  return { pass:'s-pass', fail:'s-fail', pending:'s-pending' }[s] || 's-pending';
}

function render() {
  const q = state.search.trim().toLowerCase();
  const total = data.categories.reduce((a,c) => a + c.items.length, 0);
  const done = data.categories.reduce((a,c) => a + c.items.filter(i => i.s === 'pass' || i.s === 'fail').length, 0);
  const pct = total ? Math.round(done/total*100) : 0;
  progFill.style.width = pct + '%';
  progLabel.textContent = `${done} / ${total} sonuçlandı (${pct}%) · ${total-done} bekliyor`;

  catsEl.innerHTML = '';

  if (!data.categories.length) {
    catsEl.innerHTML = '<div class="empty">Henüz kategori yok. "+ Kategori Ekle" ile başlayın.</div>';
    return;
  }

  data.categories.forEach((cat, ci) => {
    let items = cat.items;
    if (q) {
      items = items.filter(i => (i.t||'').toLowerCase().includes(q) || (i.n||'').toLowerCase().includes(q) || (i.u||'').toLowerCase().includes(q) || cat.name.toLowerCase().includes(q));
    }
    const doneInCat = cat.items.filter(i => i.s === 'pass' || i.s === 'fail').length;
    const isCollapsed = state.collapsed[cat.id];

    const head = document.createElement('div');
    head.className = 'cat-head' + (isCollapsed ? ' collapsed' : '');
    head.innerHTML = `
      <span class="caret">▼</span>
      <input class="cat-name" value="${esc(cat.name)}" title="Kategori adını düzenle">
      <span class="cat-count">${doneInCat}/${cat.items.length}</span>
      <button class="icon-btn danger" title="Kategoriyi sil">✕</button>`;
    head.querySelector('.caret').addEventListener('click', e => { e.stopPropagation(); toggleCat(cat.id); });
    head.querySelector('.cat-name').addEventListener('input', e => { cat.name = e.target.value; save(); });
    head.querySelector('.cat-name').addEventListener('click', e => e.stopPropagation());
    head.querySelector('.icon-btn').addEventListener('click', e => { e.stopPropagation(); if (confirm(`"${cat.name}" kategorisini sil?`)) { removeCat(cat.id); } });
    head.addEventListener('click', () => toggleCat(cat.id));

    const body = document.createElement('div');
    body.className = 'cat-body' + (isCollapsed ? ' hidden' : '');

    if (!items.length) {
      body.innerHTML = `<div class="empty">${q ? 'Arama sonucu yok' : 'Öğe yok'}</div>`;
    }
    items.forEach(item => {
      body.appendChild(renderItem(item, cat));
    });

    const addBtn = document.createElement('button');
    addBtn.className = 'add-item';
    addBtn.textContent = '+ Öğe Ekle';
    addBtn.addEventListener('click', () => { cat.items.push({ id: uid(), t: '', u: '', s: 'pending', n: '' }); state.editingId = cat.items[cat.items.length-1].id; save(); render(); });
    body.appendChild(addBtn);

    const wrap = document.createElement('div');
    wrap.className = 'cat';
    wrap.appendChild(head);
    wrap.appendChild(body);
    catsEl.appendChild(wrap);
  });
}

function renderItem(item, cat) {
  const div = document.createElement('div');
  div.className = 'item';
  const editing = state.editingId === item.id;
  div.innerHTML = `
    <div class="main">
      <div class="text-row">
        <input type="checkbox" class="chk" ${item.s === 'pass' ? 'checked' : ''} title="Geçti olarak işaretle">
        ${editing
          ? `<input class="label editing" value="${esc(item.t)}" placeholder="Kontrol adı / sayfa başlığı">
             <button class="icon-btn" title="Kaydet">✔</button>`
          : `<div class="label ${item.s === 'fail' ? 's-fail' : ''}" ${item.t ? '' : 'style="color:var(--muted)"'}>${esc(item.t || '(başlık yok)')}</div>
             <button class="icon-btn" title="Düzenle">✎</button>`}
        <button class="icon-btn danger" title="Öğeyi sil">✕</button>
      </div>
      <div class="meta">
        <select class="status ${statusClass(item.s)}">
          <option value="pending" ${item.s==='pending'?'selected':''}>Bekliyor</option>
          <option value="pass" ${item.s==='pass'?'selected':''}>Geçti</option>
          <option value="fail" ${item.s==='fail'?'selected':''}>Kaldı</option>
        </select>
        ${item.u
          ? (editing
              ? `<input class="url-input" value="${esc(item.u)}" placeholder="URL">
                 <a class="url" href="${esc(item.u)}" target="_blank" rel="noopener" title="Aç">↗</a>`
              : `<a class="url" href="${esc(item.u)}" target="_blank" rel="noopener">${esc(item.u)}</a>`)
          : (editing ? `<input class="url-input" placeholder="URL">` : `<span class="url" style="opacity:.5">(URL yok)</span>`)}
      </div>
      <textarea class="note" placeholder="Not (hatalar, bulgular…)">${esc(item.n || '')}</textarea>
    </div>`;
  div.querySelector('.chk').addEventListener('change', e => {
    item.s = e.target.checked ? 'pass' : (item.s === 'pass' ? 'pending' : item.s);
    save(); render();
  });
  div.querySelector('.status').addEventListener('change', e => { item.s = e.target.value; save(); render(); });
  div.querySelector('.note').addEventListener('input', e => { item.n = e.target.value; save(); });
  const editBtn = div.querySelector('.icon-btn:not(.danger)');
  if (editBtn) editBtn.addEventListener('click', () => { state.editingId = item.id; render(); });
  const saveBtn = div.querySelector('.label.editing') && div.querySelector('.label.editing').nextElementSibling;
  const editInput = div.querySelector('.label.editing');
  if (editInput) {
    editInput.focus();
    const commit = () => { item.t = editInput.value.trim(); state.editingId = null; save(); render(); };
    editInput.addEventListener('keydown', e => { if (e.key === 'Enter') commit(); if (e.key === 'Escape') { state.editingId = null; render(); } });
    if (saveBtn) saveBtn.addEventListener('click', commit);
  }
  const urlInput = div.querySelector('.url-input');
  if (urlInput) {
    urlInput.addEventListener('input', e => { item.u = e.target.value.trim(); save(); });
    urlInput.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === 'Escape') { state.editingId = null; render(); } });
  }
  div.querySelector('.icon-btn.danger').addEventListener('click', () => {
    cat.items = cat.items.filter(x => x.id !== item.id); save(); render();
  });
  return div;
}

/* ======= Eylemler ======= */
function toggleCat(id) { state.collapsed[id] = !state.collapsed[id]; render(); }
function removeCat(id) { data.categories = data.categories.filter(c => c.id !== id); save(); render(); }

document.getElementById('btnAddCat').addEventListener('click', () => {
  data.categories.push({ id: uid(), name: 'Yeni Kategori', items: [] });
  save(); render();
});

document.getElementById('btnCollapse').addEventListener('click', () => {
  const all = Object.keys(state.collapsed).length === data.categories.length && data.categories.every(c => state.collapsed[c.id]);
  data.categories.forEach(c => state.collapsed[c.id] = !all);
  render();
});

document.getElementById('search').addEventListener('input', e => { state.search = e.target.value; render(); });

document.getElementById('btnExport').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'checklist-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
});

document.getElementById('btnImport').addEventListener('click', () => document.getElementById('fileInput').click());
document.getElementById('fileInput').addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!d || !Array.isArray(d.categories)) throw new Error('format hatalı');
      if (confirm('Mevcut veri JSON içe aktarımıyla değiştirilecek. Devam?')) {
        data = d; save(); render();
      }
    } catch(err) { alert('Geçersiz JSON: ' + err.message); }
  };
  r.readAsText(f);
  e.target.value = '';
});

document.getElementById('btnReset').addEventListener('click', () => {
  if (confirm('Tüm değişiklikler silinip varsayılan listeye dönülecek. Devam?')) {
    data = structuredClone(DEFAULT_DATA); save(); render();
  }
});

render();
</script>
</body>
</html>
